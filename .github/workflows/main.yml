name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Active Record ${{ matrix.activerecord.version }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
        activerecord:
          - version: '7.2'
            gemfile: gemfiles/activerecord_7_2.gemfile
          - version: '8.0'
            gemfile: gemfiles/activerecord_8_0.gemfile
          - version: '8.1'
            gemfile: gemfiles/activerecord_8_1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.activerecord.gemfile }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake
